<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans p-5 select-none overflow-y-auto">

    <div class="flex items-center gap-3 mb-6">
        <span class="w-5 h-5 rounded-full bg-indigo-400"></span>
        <h1 class="text-2xl font-bold tracking-tight">Overlay</h1>
    </div>

    <!-- Type -->
    <div class="mb-4">
        <span class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-2">Type</span>
        <div class="flex gap-2">
            <button id="btn-type-color" onclick="setType('color')"
                class="flex-1 py-2 text-sm font-medium rounded-lg border border-indigo-500 bg-indigo-600 text-white transition-all duration-150 cursor-pointer">
                Color
            </button>
            <button id="btn-type-blur" onclick="setType('blur')"
                class="flex-1 py-2 text-sm font-medium rounded-lg border border-gray-700 text-gray-400 hover:border-gray-600 hover:text-gray-200 transition-all duration-150 cursor-pointer">
                Blur
            </button>
            <button id="btn-type-image" onclick="setType('image')"
                class="flex-1 py-2 text-sm font-medium rounded-lg border border-gray-700 text-gray-400 hover:border-gray-600 hover:text-gray-200 transition-all duration-150 cursor-pointer">
                Image
            </button>
        </div>
    </div>

    <!-- Color -->
    <div id="colorRow" class="mb-4">
        <span class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-2">Color</span>
        <div class="flex items-center gap-3">
            <input type="color" id="colorPicker" value="#6366f1"
                class="h-10 w-16 rounded-lg cursor-pointer border border-gray-700 bg-gray-800 p-1">
            <span id="colorHex" class="text-sm text-gray-400 font-mono">#6366f1</span>
        </div>
    </div>

    <!-- Image -->
    <div id="imageRow" class="mb-4" style="display:none">
        <span class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-2">Image</span>
        <div class="flex items-center gap-3">
            <button onclick="pickImage()"
                class="px-3 py-2 text-sm bg-gray-800 border border-gray-700 rounded-lg text-gray-300 hover:border-indigo-500 transition-colors cursor-pointer">
                Choose File
            </button>
            <span id="imageFilename" class="text-sm text-gray-400 truncate">No image selected</span>
        </div>
    </div>

    <!-- Layer -->
    <div class="mb-4">
        <span class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-2">Layer</span>
        <div class="flex gap-2">
            <button id="btn-layer-top" onclick="setLayer('top')"
                class="flex-1 py-2 text-sm font-medium rounded-lg border border-indigo-500 bg-indigo-600 text-white transition-all duration-150 cursor-pointer">
                Above Everything
            </button>
            <button id="btn-layer-desktop" onclick="setLayer('desktop')"
                class="flex-1 py-2 text-sm font-medium rounded-lg border border-gray-700 text-gray-400 hover:border-gray-600 hover:text-gray-200 transition-all duration-150 cursor-pointer">
                Above Desktop
            </button>
        </div>
    </div>

    <!-- Size -->
    <div class="mb-4">
        <span class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-2">Size</span>
        <div class="flex gap-3">
            <label class="flex-1">
                <span class="text-xs text-gray-500 mb-1 block">Width</span>
                <input type="number" id="width" value="200" min="50"
                    class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 focus:outline-none focus:border-indigo-500 transition-colors">
            </label>
            <label class="flex-1">
                <span class="text-xs text-gray-500 mb-1 block">Height</span>
                <input type="number" id="height" value="200" min="50"
                    class="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-100 focus:outline-none focus:border-indigo-500 transition-colors">
            </label>
        </div>
    </div>

    <!-- Opacity -->
    <div class="mb-5">
        <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-semibold uppercase tracking-wider text-gray-500">Opacity</span>
            <span id="opacityDisplay" class="text-xs text-indigo-400 font-mono">100%</span>
        </div>
        <input type="range" id="opacitySlider" min="0.1" max="1" step="0.05" value="1"
            class="w-full accent-indigo-500 cursor-pointer"
            oninput="updateOpacity(this.value)">
    </div>

    <!-- Presets -->
    <div class="mb-5">
        <span class="block text-xs font-semibold uppercase tracking-wider text-gray-500 mb-2">Presets</span>
        <div class="grid grid-cols-3 gap-2">
            <div id="preset-0"></div>
            <div id="preset-1"></div>
            <div id="preset-2"></div>
            <div id="preset-3"></div>
            <div id="preset-4"></div>
            <div id="preset-5"></div>
        </div>
    </div>

    <!-- Create -->
    <button onclick="spawn()"
        class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 active:scale-[0.98] rounded-xl font-semibold text-white text-sm transition-all duration-150 cursor-pointer">
        Create Pane
    </button>

    <script>
        // ipcRenderer lets this page send messages to main.js (Electron inter-process communication)
        const { ipcRenderer } = require('electron');

        // Track currently selected options — used when spawning a pane or saving a preset
        let selectedType = 'color';
        let selectedLayer = 'top';
        let selectedImagePath = '';

        // Tailwind classes applied to toggle buttons depending on their active/inactive state
        const activeClasses = ['bg-indigo-600', 'border-indigo-500', 'text-white'];
        const inactiveClasses = ['border-gray-700', 'text-gray-400'];

        function setActive(btn) {
            btn.classList.add(...activeClasses);
            btn.classList.remove(...inactiveClasses);
        }
        function setInactive(btn) {
            btn.classList.remove(...activeClasses);
            btn.classList.add(...inactiveClasses);
        }

        // Update the selected type, swap button styles, and show/hide the relevant config row
        function setType(type) {
            selectedType = type;
            // Deactivate all type buttons then activate the selected one
            setInactive(document.getElementById('btn-type-color'));
            setInactive(document.getElementById('btn-type-blur'));
            setInactive(document.getElementById('btn-type-image'));
            setActive(document.getElementById('btn-type-' + type));
            // Show only the row that matches the selected type
            if (type === 'color') {
                document.getElementById('colorRow').style.display = '';
                document.getElementById('imageRow').style.display = 'none';
            } else if (type === 'image') {
                document.getElementById('colorRow').style.display = 'none';
                document.getElementById('imageRow').style.display = '';
            } else {
                document.getElementById('colorRow').style.display = 'none';
                document.getElementById('imageRow').style.display = 'none';
            }
        }

        // Update the selected layer and swap button styles
        function setLayer(layer) {
            selectedLayer = layer;
            if (layer === 'top') {
                setActive(document.getElementById('btn-layer-top'));
                setInactive(document.getElementById('btn-layer-desktop'));
            } else {
                setActive(document.getElementById('btn-layer-desktop'));
                setInactive(document.getElementById('btn-layer-top'));
            }
        }

        // Keep the percentage label in sync as the slider moves
        function updateOpacity(val) {
            document.getElementById('opacityDisplay').textContent = Math.round(val * 100) + '%';
        }

        // Mirror the hex value next to the color picker as the user picks a color
        document.getElementById('colorPicker').addEventListener('input', e => {
            document.getElementById('colorHex').textContent = e.target.value;
        });

        // Open a native file dialog via main process and store the returned absolute path
        async function pickImage() {
            const filePath = await ipcRenderer.invoke('pick-image');
            if (filePath) {
                selectedImagePath = filePath;
                document.getElementById('imageFilename').textContent = filePath.split('\\').pop().split('/').pop();
            }
        }

        // Build all six preset cards from localStorage — called on load and after every save
        function renderPresets() {
            for (let i = 0; i < 6; i++) {
                const container = document.getElementById(`preset-${i}`);
                const preset = JSON.parse(localStorage.getItem(`preset-${i}`));
                if (preset) {
                    const isBlur = preset.type === 'blur';
                    const isImage = preset.type === 'image';
                    const name = preset.name ?? `Preset ${i + 1}`;
                    let swatchStyle;
                    if (isBlur) {
                        swatchStyle = 'background: linear-gradient(135deg, #1e293b 25%, #334155 50%, #1e293b 75%)';
                    } else if (isImage) {
                        // Show the actual image as the swatch thumbnail
                        const fileUrl = 'file:///' + preset.src.replace(/\\/g, '/');
                        swatchStyle = `background-image: url("${fileUrl}"); background-size: cover; background-position: center`;
                    } else {
                        swatchStyle = `background:${preset.colour}`;
                    }
                    let detail;
                    if (isBlur) {
                        detail = `${preset.width}×${preset.height} · blur`;
                    } else if (isImage) {
                        const filename = preset.src.split('\\').pop().split('/').pop();
                        detail = `${preset.width}×${preset.height} · ${filename}`;
                    } else {
                        detail = `${preset.width}×${preset.height} · <span class="font-mono">${preset.colour}</span>`;
                    }
                    let blurLabel = '';
                    if (isBlur) {
                        blurLabel = '<span style="font-size:10px;color:#94a3b8;letter-spacing:0.05em">BLUR</span>';
                    }
                    container.innerHTML = `
                        <div class="rounded-lg border border-gray-700 overflow-hidden">
                            <div class="h-8 cursor-pointer hover:opacity-80 transition-opacity flex items-center justify-center"
                                 style="${swatchStyle}"
                                 onclick="loadPreset(${i})">
                                ${blurLabel}
                            </div>
                            <div class="bg-gray-800 px-2 pt-1 pb-1">
                                <div class="flex justify-between items-center mb-0.5">
                                    <span id="preset-name-${i}"
                                          class="text-xs text-gray-200 font-medium truncate cursor-pointer hover:text-white"
                                          onclick="startRename(${i})"
                                          title="Click to rename">${name}</span>
                                    <button onclick="savePreset(${i})" class="text-xs text-gray-500 hover:text-indigo-400 transition-colors ml-1 flex-shrink-0" title="Overwrite">↑</button>
                                </div>
                                <div class="text-xs text-gray-500">${detail}</div>
                            </div>
                        </div>`;
                } else {
                    container.innerHTML = `
                        <div class="rounded-lg border border-dashed border-gray-700 overflow-hidden">
                            <div class="h-8 bg-gray-800/50"></div>
                            <div class="bg-gray-800/30 px-2 py-1 flex justify-between items-center">
                                <span class="text-xs text-gray-600">empty</span>
                                <button onclick="savePreset(${i})" class="text-xs text-gray-500 hover:text-indigo-400 transition-colors" title="Save">↑</button>
                            </div>
                        </div>`;
                }
            }
        }

        // Replace the name span with a text input; commit on blur or Enter, cancel on Escape
        function startRename(index) {
            const span = document.getElementById(`preset-name-${index}`);
            if (!span) return;
            const input = document.createElement('input');
            input.value = span.textContent;
            input.className = 'text-xs text-white font-medium bg-transparent border-b border-indigo-500 outline-none w-full min-w-0';
            span.replaceWith(input);
            input.focus();
            input.select();

            function commit() {
                const preset = JSON.parse(localStorage.getItem(`preset-${index}`));
                if (preset) {
                    preset.name = input.value.trim() || `Preset ${index + 1}`;
                    localStorage.setItem(`preset-${index}`, JSON.stringify(preset));
                }
                renderPresets();
            }

            input.addEventListener('blur', commit);
            input.addEventListener('keydown', e => {
                if (e.key === 'Enter') input.blur();
                if (e.key === 'Escape') renderPresets(); // discard changes
            });
        }

        // Snapshot the current settings into a preset slot, preserving any existing name
        function savePreset(index) {
            const colour = document.getElementById('colorPicker').value;
            const opacity = document.getElementById('opacitySlider').value;
            const width = Number(document.getElementById('width').value);
            const height = Number(document.getElementById('height').value);
            // Keep the existing name if the slot already has one
            const existing = JSON.parse(localStorage.getItem(`preset-${index}`));
            const name = existing?.name ?? `Preset ${index + 1}`;
            const src = selectedType === 'image' ? selectedImagePath : '';
            localStorage.setItem(`preset-${index}`, JSON.stringify({ name, colour, src, opacity, layer: selectedLayer, width, height, type: selectedType }));
            renderPresets();
        }

        // Restore all controls to match a saved preset
        function loadPreset(index) {
            const preset = JSON.parse(localStorage.getItem(`preset-${index}`));
            if (!preset) return;
            document.getElementById('colorPicker').value = preset.colour;
            document.getElementById('colorHex').textContent = preset.colour;
            document.getElementById('opacitySlider').value = preset.opacity;
            document.getElementById('width').value = preset.width;
            document.getElementById('height').value = preset.height;
            updateOpacity(preset.opacity);
            setLayer(preset.layer);
            // Fall back to 'color' for any presets saved before type tracking was added
            setType(preset.type ?? 'color');
            if (preset.type === 'image') {
                selectedImagePath = preset.src;
                const filename = preset.src.split('\\').pop().split('/').pop();
                document.getElementById('imageFilename').textContent = filename;
            }
        }

        // Read all current settings, build the config, and tell main.js to open a new pane window
        function spawn() {
            const opacity = document.getElementById('opacitySlider').value;
            const width = Number(document.getElementById('width').value);
            const height = Number(document.getElementById('height').value);
            let config;
            if (selectedType === 'blur') {
                config = { type: 'blur', layer: selectedLayer, opacity, width, height };
            } else if (selectedType === 'image') {
                config = { type: 'image', src: selectedImagePath, layer: selectedLayer, opacity, width, height };
            } else {
                config = { type: 'color', value: document.getElementById('colorPicker').value, layer: selectedLayer, opacity, width, height };
            }
            ipcRenderer.send('create-pane', config);
        }

        renderPresets();
    </script>
</body>
</html>
