<!DOCTYPE html>
<html>
<head>
    <style>
        html, body { 
            background: transparent !important;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        body{
            -webkit-app-region: drag; 
        }

        #box {
            width: 100vw; 
            height: 100vh;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div id="box"></div>
    <script>
        const { ipcRenderer } = require('electron');
        ipcRenderer.on('init-pane', (event, config) => {
            const box = document.getElementById('box');
            box.className = ''; 
            box.style.backgroundColor = 'transparent'; // Start clean

            if (config.type === 'color') {
                box.style.backgroundColor = config.value;
            } 
        });
    </script>
</body>
</html>
