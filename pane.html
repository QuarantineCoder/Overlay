<!DOCTYPE html>
<html>
<head>
    <style>
        html, body {
            background: transparent !important;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        body {
            -webkit-app-region: drag;
        }

        #box {
            width: 100vw;
            height: 100vh;
            box-sizing: border-box;
        }

        #closeBtn, #duplicateBtn {
            position: fixed;
            top: 6px;
            width: 22px;
            height: 22px;
            background: rgba(0, 0, 0, 0.5);
            border: none;
            border-radius: 50%;
            color: #fff;
            line-height: 1;
            cursor: pointer;
            /* Must opt out of drag so clicks register instead of dragging the window */
            -webkit-app-region: no-drag;
            opacity: 0;
            transition: opacity 0.15s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #closeBtn     { right: 6px;  font-size: 15px; }
        #duplicateBtn { right: 33px; font-size: 12px; }

        body:hover #closeBtn,
        body:hover #duplicateBtn {
            opacity: 1;
        }

        #closeBtn:hover     { background: rgba(180, 40, 40, 0.8); }
        #duplicateBtn:hover { background: rgba(99, 102, 241, 0.8); }
    </style>
</head>
<body>
    <div id="box"></div>
    <button id="closeBtn" onclick="window.close()" title="Close">×</button>
    <button id="duplicateBtn" title="Duplicate">⧉</button>
    <script>
        const { ipcRenderer } = require('electron');
        const fs = require('fs');

        let paneConfig = null; // remembered so right-click can send an exact copy

        ipcRenderer.on('init-pane', (event, config) => {
            paneConfig = config;
            const box = document.getElementById('box');
            box.className = '';
            box.style.backgroundColor = 'transparent'; // Start clean

            if (config.type === 'color') {
                box.style.backgroundColor = config.value;
            } else if (config.type === 'image' && config.src) {
                // Read file via Node fs and use a base64 data URL — avoids all file:// URL security issues
                const ext = config.src.split('.').pop().toLowerCase();
                const mimeTypes = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', webp: 'image/webp', bmp: 'image/bmp' };
                const mime = mimeTypes[ext] || 'image/jpeg';
                const data = fs.readFileSync(config.src).toString('base64');
                const img = document.createElement('img');
                img.src = `data:${mime};base64,${data}`;
                img.style.cssText = 'width:100%;height:100%;object-fit:fill;display:block;';
                box.appendChild(img);
            }
        });

        document.getElementById('duplicateBtn').addEventListener('click', () => {
            if (paneConfig) ipcRenderer.send('duplicate-pane', paneConfig);
        });
    </script>
</body>
</html>
